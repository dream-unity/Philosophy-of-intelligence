<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0e1618"><title>Games</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0e1618;color:#eff2e9;font:16px/1.5 system-ui,sans-serif}
main{width:min(1100px,100%);margin:auto;padding:clamp(20px,5vw,64px)}nav{border-bottom:1px solid #354340;padding-bottom:14px}
nav a{color:#ced8d0;text-decoration:none}nav a:hover{text-decoration:underline}h1{font-size:clamp(48px,9vw,100px);letter-spacing:-.075em;line-height:.95;margin:.55em 0 .45em}
article a{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:stretch;color:inherit;text-decoration:none;border:1px solid #43524d;border-radius:12px;overflow:hidden;background:#192325}
article a:hover,article a:focus-visible{outline:2px solid #c7f476}article .art{width:100%;height:100%;min-height:240px;background:#10191b}
.copy{align-self:center;padding:clamp(20px,4vw,48px)}h2{font-size:clamp(26px,4.5vw,50px);margin:0;line-height:1.08;letter-spacing:-.06em}
p{color:#bbcac5;max-width:32ch}.play{display:inline-block;margin-top:.6em;border-radius:6px;padding:10px 20px;font-weight:700;color:#172313;background:#c7f476}
@media(max-width:580px){article a{grid-template-columns:1fr}.art{max-height:230px}.copy{padding:22px}}
</style></head>
<body><main><nav><a href="/">Philosophy of Intelligence</a></nav><h1>Games</h1>
