name: Common Earth tablet comparison
on:
  push:
    branches: [codex/common-earth-tablet-final]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          path: after
      - uses: actions/checkout@v4
        with:
          path: before
          ref: b9c2e18ade56490cfc5dee4858990bf0cdc3f7e3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install playwright==1.56.0
      - name: Replay town observation on both versions
        run: |
          node after/qa/seed.cjs
          python -m http.server 8123 --bind 127.0.0.1 > /tmp/common-earth-server.log 2>&1 &
          python after/qa/tablet.py
