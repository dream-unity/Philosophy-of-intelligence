<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#132725">
  <meta name="description" content="Take a shift as the trauma doctor. Read the handover, connect the clues and make the call.">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./shift.css?v=2">
  <title>Trauma Doctor · Night Shift</title>
  <script>
    // Keep direct links to the original N-back and monitor modes working.
    const requestedMode = new URLSearchParams(location.search).get('mode');
    if (requestedMode === 'nback' || requestedMode === 'monitor') {
      location.replace('./monitor.html' + location.search + location.hash);
    }
  </script>
</head>
<body>
  <header class="mast">
    <a class="game-home" href="/games/" aria-label="Back to games"><span class="medical-mark" aria-hidden="true">✚</span></a>
    <h1>Trauma Doctor</h1><span class="compact-case-name" id="compact-case-name" aria-hidden="true"></span>
    <span class="mast-line" aria-hidden="true"></span>
    <span class="shift-count" id="progress"></span>
    <div class="shift-dots" id="shift-track" aria-hidden="true"></div>
    <button class="menu" id="menu" type="button" aria-label="Pause and open shift options" aria-haspopup="dialog"><span aria-hidden="true" class="pause-symbol"></span><span class="full-label">Shift</span></button>
  </header>

  <main id="game" class="game" aria-label="Ward shift">
    <article class="case-board" id="case-board">
      <section class="handover" aria-labelledby="case-title">
        <div class="location" id="location">
          <img id="scene" src="./scenes/before.webp" alt="">
          <div class="scene-caption"><span id="phase"></span><h2 id="case-title"></h2></div>
        </div>
        <div class="clue-area">
          <div class="panel-label"><span class="line-stamp" aria-hidden="true"></span><h3>Handover</h3></div>
          <ol class="clues" id="clues"></ol>
        </div>
      </section>

      <section class="decision" id="decision" aria-label="Your decision">
        <div class="panel-label"><span class="on-duty" aria-hidden="true"></span><h3 id="call-label">Your call</h3><span id="timer" role="timer" hidden></span></div>
        <h2 id="question" tabindex="-1"></h2>
        <div id="options" class="options" role="group" aria-labelledby="question"></div>
        <div id="submit-row" class="submit-row" hidden><span id="select-hint"></span><button id="commit" class="primary" type="button">Confirm call</button></div>
        <section id="feedback" tabindex="-1" hidden aria-label="Case debrief">
          <div class="verdict" id="verdict"></div>
          <p class="chosen" id="chosen"></p>
          <p class="rationale" id="rationale"></p>
          <p class="skill" id="skill"></p>
          <div class="feedback-actions"><button id="advance" class="primary" type="button">Next case</button><button id="change" class="secondary" type="button" hidden>Change one clue</button></div>
        </section>
      </section>
    </article>
    <footer class="foot"><span id="score"></span><span id="keyboard-hint">1–4 choose <b>·</b> Space continues</span></footer>
  </main>

  <dialog id="settings">
    <div class="dialog-head"><h2>Shift options</h2><button id="resume" class="close" type="button" aria-label="Resume shift">×</button></div>
    <div class="settings-list">
      <label>Shift length <input id="length" type="number" min="1" max="1000" inputmode="numeric"></label>
      <label>Decision clock <select id="pace"><option value="0">Off</option><option value="90">90 seconds</option><option value="60">60 seconds</option><option value="40">40 seconds</option></select></label>
      <label>Difficulty <select id="difficulty"><option value="0">Adaptive</option><option value="1">Intern</option><option value="2">Resident</option><option value="3">Fellow</option><option value="4">Attending</option><option value="5">Trauma lead</option><option value="6">Chief</option></select></label>
      <label>Sound <input id="sound" type="checkbox"></label>
    </div>
    <p class="settings-note">Choose an action using the handover. In a plan, pick the steps that work together.</p>
    <div class="dialog-actions"><button id="continue" class="primary" type="button">Resume shift</button><button id="end" class="secondary" type="button">End shift</button></div>
    <a class="mode-link" href="./monitor.html?mode=nback">N-back &amp; original ward modes</a>
  </dialog>
  <dialog id="summary">
    <div class="dialog-head"><h2>Shift handover</h2></div>
    <p class="summary-number" id="summary-score"></p>
    <p id="summary-detail"></p>
    <div id="review" class="review"></div>
    <div class="dialog-actions"><button class="primary" id="again" type="button">Start next shift</button><a href="/games/">All games</a></div>
  </dialog>
  <noscript>This game needs JavaScript to build and score each case.</noscript>
  <script type="module" src="./shift.js?v=2"></script>
</body>
</html>
