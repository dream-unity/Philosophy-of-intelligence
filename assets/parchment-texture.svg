<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="268" height="268" viewBox="0 0 268 268">
  <!-- User-supplied paper sample, displayed at its original 134px size.
       Mirrored neighbours share identical edge pixels for a seamless repeat. -->
  <defs>
    <image id="paper" width="134" height="134" xlink:href="data:image/webp;base64," />
  </defs>
  <use xlink:href="#paper" />
  <use xlink:href="#paper" transform="translate(268 0) scale(-1 1)" />
  <use xlink:href="#paper" transform="translate(0 268) scale(1 -1)" />
  <use xlink:href="#paper" transform="translate(268 268) scale(-1 -1)" />
</svg>
