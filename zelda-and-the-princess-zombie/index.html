    <main id="app">
      <section id="title-screen" class="title-screen" aria-labelledby="game-title">
        <header class="title-header">
          <a class="home" href="/"
            ><svg aria-hidden="true"><use href="#sigil" /></svg><span>Philosophy of Intelligence</span></a
          >
          <button id="title-sound" class="text-tool" type="button">
            <svg aria-hidden="true"><use href="#sound" /></svg><span>Sound on</span>
          </button>
        </header>
        <div class="title-body">
          <div class="eyebrow"><i></i>A first-person dark fantasy</div>
          <h1 id="game-title">
            <span class="main-word">Zelda</span><span class="join"><i></i>and the<i></i></span
            ><span class="second-word">Princess Zombie</span>
          </h1>
          <p class="intro">Beyond the forest, a bell is calling. Reach Princess Xero before the dead do.</p>
          <button id="start" class="primary" type="button">
            <svg aria-hidden="true"><use href="#sword" /></svg><span>Enter the forest</span>
          </button>
          <button id="history" type="button" class="link-button" hidden>Past journeys</button>
          <button id="fresh" type="button" class="link-button" hidden>Begin anew</button>
          <div id="startup-status" role="status"></div>
        </div>
        <footer class="title-footer">
          <button id="help" class="text-tool" type="button">
            <svg aria-hidden="true"><use href="#book" /></svg>How to play
          </button>
          <button id="save-files" class="text-tool" type="button">Save files</button>
          <button id="fullscreen" class="text-tool" type="button">
            <svg aria-hidden="true"><use href="#expand" /></svg><span>Fullscreen</span>
          </button>
        </footer>
      </section>
      <section id="stage" aria-label="First-person game" hidden>
        <canvas id="view" aria-label="First-person view of the forest and castle" tabindex="0"></canvas>
        <div class="lens"></div>
        <div id="damage"></div>
        <div id="sequence-caption" aria-live="polite" hidden></div>
        <button id="resist" class="primary" type="button" hidden>Pull your hand back</button>
        <div id="storage-status" role="status"></div>
        <div class="hud" id="hud">
          <div class="hud-top">
            <div class="vitals">
              <div class="health" id="health" role="meter" aria-label="Health" aria-valuemin="0"></div>
              <span id="location"></span>
            </div>
            <div class="compass" aria-label="Compass"><span id="heading">N</span><i></i></div>
            <div class="utility">
              <button id="bag-button" title="Bag (B)" aria-label="Open traveller’s bag">
                <svg aria-hidden="true"><use href="#pack" /></svg>
              </button>
              <button id="map-button" title="Map (M)" aria-label="Open map">
                <svg aria-hidden="true"><use href="#mapicon" /></svg></button
              ><button id="pause-button" title="Pause (Esc)" aria-label="Pause">
                <svg aria-hidden="true"><use href="#pauseicon" /></svg>
              </button>
            </div>
          </div>
          <div class="objective" id="objective"></div>
          <div class="route-readout" id="route-readout"></div>
          <div class="race-readout" id="race-readout" role="status" aria-live="polite"></div>
          <div class="belt-readout" id="belt-readout" role="status"></div>
          <div
            class="stamina"
            id="stamina"
            role="meter"
            aria-label="Stamina"
            aria-valuemin="0"
            aria-valuemax="100"
          >
            <i></i>
          </div>
          <div class="reticle"></div>
          <div class="feedback">
            <div id="bell-call" aria-live="polite" hidden></div>
            <div id="captions" aria-live="polite"></div>
            <div id="notice" role="status"></div>
            <button type="button" id="interact-hint" hidden></button>
          </div>
          <div class="game-bottom">
            <div id="stick" class="stick" aria-label="Movement joystick"><i></i></div>
            <div class="master-keys">
              <button
                type="button"
                id="quick-tools"
                aria-label="Open action palette"
                aria-expanded="false"
                aria-controls="tool-palette"
              >
                <svg aria-hidden="true"><use href="#tools-icon" /></svg><span>Tools</span>
              </button>
              <button type="button" id="field-action" aria-label="Swing sword">
                <svg aria-hidden="true"><use href="#sword" /></svg><span>Sword</span>
              </button>
            </div>
            <div class="equipment" id="tool-palette" aria-label="Action palette">
              <button data-act="interact" aria-label="Interact">
                <svg><use href="#hand" /></svg><span>Interact</span><kbd>E</kbd>
              </button>
              <button data-act="potion" aria-label="Use potion">
                <svg><use href="#flask" /></svg><span id="potion-count">Potion</span><kbd>Q</kbd>
              </button>
              <button data-act="strike" aria-label="Swing sword">
                <svg><use href="#sword" /></svg><span>Sword</span><kbd>F</kbd>
              </button>
              <button data-act="thrust" aria-label="Thrust">
                <svg><use href="#sword" /></svg><span>Thrust</span><kbd>R</kbd>
              </button>
              <button data-act="guard" aria-label="Guard">
                <svg><use href="#sigil" /></svg><span>Guard</span><kbd>G</kbd>
              </button>
              <button data-act="dodge" aria-label="Dodge">
                <svg aria-hidden="true"><use href="#leap" /></svg><span>Dodge</span><kbd>Space</kbd>
              </button>
              <button id="sprint" aria-label="Toggle sprint" aria-pressed="false">
                <svg><use href="#run" /></svg><span>Run</span>
              </button>
              <button id="palette-bag" class="palette-extra" type="button">
                <svg aria-hidden="true"><use href="#pack" /></svg><span>Bag</span>
              </button>
              <button id="palette-guide" class="palette-extra" type="button">
                <svg aria-hidden="true"><use href="#book" /></svg><span>Controls</span>
              </button>
            </div>
          </div>
        </div>
      </section>
      <div id="overlay" class="overlay" hidden>
        <section class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title">
          <div class="panel-rule">
            <i></i><svg><use href="#sigil" /></svg><i></i>
          </div>
          <button id="panel-close" class="close" aria-label="Close">
            <svg><use href="#close" /></svg>
          </button>
          <p id="panel-kicker" class="eyebrow"></p>
          <h2 id="panel-title" tabindex="-1"></h2>
          <div id="panel-body"></div>
          <div id="panel-actions"></div>
        </section>
      </div>
    </main>
